name: Wicklow project source monitor
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wicklow-source-monitor
  cancel-in-progress: false
jobs:
  check-official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check official Wicklow project sources
        run: python scripts/monitor_wicklow_sources.py
      - name: Publish monitoring results
        run: |
          if ! git diff --quiet -- data/wicklow-monitor.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/wicklow-monitor.json
            git commit -m "Refresh Wicklow official project source monitor"
            git push
          else
            echo "No source-monitor data changes."
          fi
