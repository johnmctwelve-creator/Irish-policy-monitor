name: Refresh public consultation feed
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch official consultation sources
        run: python scripts/refresh_consultations.py
      - name: Commit refreshed feed
        run: |
          if git diff --quiet -- data/consultations.json; then
            echo "No consultation feed changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/consultations.json
            git commit -m "Refresh public consultation feed"
            git push
          fi
